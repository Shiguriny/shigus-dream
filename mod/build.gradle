plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

// Единый источник версии мода. Каждая самостоятельная партия изменений
// получает следующий patch-релиз: 0.4.4, 0.4.5 и т.д.
version = file('../VERSION').text.trim()
group = 'com.shigusdream'

base {
    archivesName = 'shigusdream'
}

loom {
    accessWidenerPath = file('src/main/resources/shigusdream.accesswidener')
}

repositories {
    // Loom добавляет необходимые репозитории (Fabric, Mojang, Maven Central) сам.
    maven { url = 'https://maven.terraformersmc.com/releases/' } // Mod Menu API
}

dependencies {
    minecraft "com.mojang:minecraft:26.1.2"
    // MC 26.x распространяется без обфускации — маппинги и mod*-конфигурации не нужны.
    implementation "net.fabricmc:fabric-loader:0.19.3"
    implementation "net.fabricmc.fabric-api:fabric-api:0.155.2+26.1.2"
    implementation "net.fabricmc:fabric-language-kotlin:1.13.13+kotlin.2.4.10"
    // Mod Menu API — только для компиляции; в рантайме опционален (entrypoint "modmenu").
    compileOnly "com.terraformersmc:modmenu:18.0.0"

    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:6.1.3'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

kotlin {
    jvmToolchain(25)
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.test {
    useJUnitPlatform()
}

tasks.processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
