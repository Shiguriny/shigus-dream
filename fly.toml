# Fly.io: app + внешний Postgres (Neon/Supabase) или fly postgres attach.
# Деплой: fly launch --no-deploy (создаст app), затем fly deploy.
app = "shigusdream-backend"
primary_region = "waw"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  SHIGU_PORT = "8080"
  SHIGU_STORAGE = "postgres"
  # SHIGU_DATABASE_URL и SHIGU_JWT_SECRET задаются секретами:
  #   fly secrets set SHIGU_DATABASE_URL="postgres://..." SHIGU_JWT_SECRET="<длинный-случайный>"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250
