<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Shigu's Dream — веб-панель</title>
<style>
  body { font-family: system-ui, sans-serif; background: #101020; color: #C8C8D8; margin: 0; padding: 1.5rem 2rem; }
  .badge { font-size: 1.05rem; color: #B088FF; letter-spacing: .3px; }
  .badge .on { color: #55FF55; }
  h1 { font-size: 1.1rem; color: #F2F2FF; font-weight: 600; margin: .2rem 0 1.2rem; }
  .card { position: relative; background: #171727; border: 1px solid #34344C; border-left: 4px solid #7C5CFF;
    border-radius: 4px; padding: .9rem 1.2rem; margin-bottom: 1rem; max-width: 660px; }
  label { display: block; font-size: .78rem; color: #A0A0B0; margin: .5rem 0 .2rem; letter-spacing: .3px; }
  input, select, button { display: block; width: 100%; box-sizing: border-box; margin: .25rem 0;
    padding: .45rem .6rem; border-radius: 2px; border: 1px solid #4A4A6A; background: #171727;
    color: #F2F2FF; font-size: .92rem; }
  input:focus, select:focus { outline: none; border-color: #B088FF; }
  input::placeholder { color: #606070; }
  button { background: #22223A; color: #F2F2FF; cursor: pointer; border-left-width: 4px; transition: background .12s; }
  button:hover { background: #3A3A55; }
  button.accent { background: #26214A; border-color: #7C5CFF; color: #FFF; }
  button.accent:hover { background: #332B5E; }
  .row { display: flex; gap: .5rem; } .row > * { flex: 1; }
  select { appearance: none; }
  #log { font-family: ui-monospace, monospace; font-size: .8rem; color: #7FD77F;
    background: #0D0D18; border: 1px solid #34344C; padding: .5rem .7rem; max-height: 180px; overflow-y: auto; }
  #status { color: #FFD76E; min-height: 1.1em; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="badge">[Shigu's Dream] <span class="on">веб-панель</span></div>
<h1>Управление сетью мода</h1>

<div class="card" id="loginCard">
  <label>Refresh-токен владельца (config/shigusdream/tokens.json на клиенте)</label>
  <input id="refreshToken" placeholder="refresh_token">
  <button onclick="login()">Войти</button>
</div>

<div class="card hidden" id="mainCard">
  <div class="row">
    <div>
      <label>Цель (ник или @группа)</label>
      <select id="target"></select>
    </div>
    <div>
      <label>Действие</label>
      <select id="action"></select>
    </div>
  </div>
  <label>Аргументы (JSON)</label>
  <input id="args" value='{}'>
  <div class="row">
    <button class="accent" onclick="send()">Отправить</button>
    <button class="secondary" onclick="loadUsers()">Обновить список</button>
  </div>
  <label id="status"></label>
</div>

<div class="card hidden" id="logCard">
  <label>Журнал</label>
  <div id="log"></div>
</div>

<script>
let ACCESS = null;
let actions = [];

function log(msg) {
  const el = document.getElementById('log');
  el.innerHTML = `<div>${new Date().toLocaleTimeString()} — ${msg}</div>` + el.innerHTML;
}

async function login() {
  const rt = document.getElementById('refreshToken').value.trim();
  const r = await fetch('/auth/refresh', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ refresh_token: rt }) });
  if (!r.ok) { alert('Токен отклонён: ' + r.status); return; }
  ACCESS = (await r.json()).access_token;
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('mainCard').classList.remove('hidden');
  document.getElementById('logCard').classList.remove('hidden');
  await loadUsers();
  actions = await (await fetch('/actions')).json();
  const sel = document.getElementById('action');
  actions.forEach(a => {
    const o = document.createElement('option');
    o.value = a.id; o.textContent = a.name;
    sel.appendChild(o);
  });
  sel.onchange = fillArgs;
  fillArgs();
}

function fillArgs() {
  const id = document.getElementById('action').value;
  const a = actions.find(x => x.id === id);
  const def = {};
  (a?.schema || []).forEach(f => {
    if (f.required || f.default !== undefined && f.default !== null)
      def[f.key] = f.default ?? '';
  });
  document.getElementById('args').value = JSON.stringify(def);
}

async function loadUsers() {
  const r = await fetch('/users', { headers: { Authorization: 'Bearer ' + ACCESS } });
  if (!r.ok) { log('Ошибка /users: ' + r.status); return; }
  const users = (await r.json()).users;
  const sel = document.getElementById('target');
  sel.innerHTML = '';
  users.forEach(u => {
    const o = document.createElement('option');
    o.value = u.username;
    o.textContent = (u.online ? '● ' : '○ ') + u.username + ' (' + u.role + ')';
    sel.appendChild(o);
  });
}

async function send() {
  let args = {};
  try { args = JSON.parse(document.getElementById('args').value || '{}'); }
  catch (e) { alert('Невалидный JSON аргументов'); return; }
  const body = {
    target: document.getElementById('target').value,
    action: document.getElementById('action').value,
    args: args,
  };
  const r = await fetch('/commands', { method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ACCESS },
    body: JSON.stringify(body) });
  const status = document.getElementById('status');
  if (r.ok) { const j = await r.json(); status.textContent = 'Отправлено: ' + JSON.stringify(j); log('→ ' + body.action + ' @ ' + body.target); }
  else { const e = await r.json().catch(() => ({})); status.textContent = 'Ошибка ' + r.status + ': ' + (e.message || ''); }
}
</script>
</body>
</html>
